<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Two encrypted sync visual gate</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #f5f5f4;
      --muted: rgb(245 245 244 / 0.68);
      --quiet: rgb(245 245 244 / 0.48);
      --accent: #7dd3fc;
      --panel: rgb(10 10 10 / 0.94);
      --panel-solid: #0a0a0a;
      --control: rgb(245 245 244 / 0.06);
      --control-hover: rgb(245 245 244 / 0.11);
      --border: rgb(245 245 244 / 0.14);
      --hairline: rgb(245 245 244 / 0.09);
      --danger: #f87171;
      --success: #6ee7b7;
      --warning: #fbbf24;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #07131f; color: var(--fg); font-size: 14px; }
    button, input { font: inherit; }
    button { color: inherit; }

    .canvas {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgb(2 6 23 / 0.04), rgb(2 6 23 / 0.66)),
        radial-gradient(circle at 17% 18%, rgb(125 211 252 / 0.24), transparent 27%),
        radial-gradient(circle at 28% 88%, rgb(180 83 9 / 0.48), transparent 35%),
        linear-gradient(145deg, #172638 0%, #213b4b 42%, #17120f 43%, #050607 100%);
    }
    .canvas::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0 34%, rgb(0 0 0 / 0.28) 55%, rgb(0 0 0 / 0.6));
      content: "";
    }
    .canvas-time {
      position: absolute;
      top: 12px;
      left: 14px;
      color: rgb(245 245 244 / 0.82);
      font-family: "Space Grotesk", Inter, ui-sans-serif, sans-serif;
      font-size: 96px;
      font-weight: 500;
      letter-spacing: -0.07em;
      line-height: 0.92;
      text-shadow: 0 2px 16px rgb(0 0 0 / 0.35);
    }
    .canvas-focus { position: absolute; bottom: 32px; left: 24px; color: rgb(245 245 244 / 0.6); font-size: 13px; }

    .drawer {
      position: fixed;
      z-index: 2;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: min(1016px, calc(100vw - 32px));
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid transparent;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgb(0 0 0 / 0.38);
      backdrop-filter: blur(14px);
      scrollbar-color: rgb(245 245 244 / 0.2) transparent;
      scrollbar-width: thin;
    }
    .drawer-header { display: flex; min-height: 72px; align-items: center; justify-content: space-between; padding: 20px 24px 16px; }
    .brand { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .mark { width: 36px; height: 36px; flex: none; border-radius: 10px; }
    .brand-name { margin: 0; font-family: "Space Grotesk", Inter, sans-serif; font-size: 16px; font-weight: 650; letter-spacing: -0.025em; }
    .brand-subtitle { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-weight: 500; }
    .close { display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 18px; }

    .settings-grid { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 24px; align-items: start; padding: 0 24px 24px; }
    .tabs { position: sticky; top: 0; display: flex; flex-direction: column; gap: 4px; padding-right: 12px; border-right: 1px solid var(--hairline); }
    .tab { min-height: 36px; padding: 6px 12px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--muted); text-align: left; }
    .tab.active { border-left-color: var(--accent); color: var(--fg); }
    .account-page { width: 100%; max-width: 704px; min-width: 0; margin: 0; }

    .section { position: relative; padding: 17px 0; border-top: 1px solid var(--hairline); }
    .section:first-child { padding-top: 3px; border-top: 0; }
    .section.trust { padding-left: 18px; }
    .section.trust::before { position: absolute; top: 18px; bottom: 18px; left: 0; width: 3px; border-radius: 99px; background: var(--accent); content: ""; opacity: 0.88; }
    .section.trust.warning::before { background: var(--warning); }
    .eyebrow { margin: 0 0 8px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.09em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-family: "Space Grotesk", Inter, sans-serif; font-size: 28px; font-weight: 610; letter-spacing: -0.045em; line-height: 1.08; }
    h2 { margin-bottom: 4px; font-size: 14px; font-weight: 650; }
    h3 { margin-bottom: 3px; font-size: 13px; font-weight: 620; }
    .lede { max-width: 600px; margin-bottom: 0; color: var(--muted); line-height: 1.5; }
    .helper { margin: 9px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .micro { color: var(--quiet); font-size: 11px; line-height: 1.4; }

    .identity-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .identity { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .avatar { display: grid; width: 42px; height: 42px; flex: none; place-items: center; border: 1px solid rgb(125 211 252 / 0.35); border-radius: 12px; background: rgb(125 211 252 / 0.08); color: var(--accent); font-family: "Space Grotesk", Inter, sans-serif; font-weight: 700; }
    .identity-copy { min-width: 0; }
    .identity-copy h1 { overflow: hidden; margin: 0 0 2px; font-size: 23px; text-overflow: ellipsis; white-space: nowrap; }
    .identity-copy p { overflow: hidden; margin: 0; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .badge { display: inline-flex; min-height: 26px; flex: none; align-items: center; border: 1px solid rgb(125 211 252 / 0.3); border-radius: 999px; background: rgb(125 211 252 / 0.08); padding: 4px 9px; color: var(--accent); font-size: 11px; font-weight: 650; }

    .status-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .status-copy { min-width: 0; }
    .status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .status-dot { width: 7px; height: 7px; flex: none; border-radius: 999px; background: var(--accent); box-shadow: 0 0 0 4px rgb(125 211 252 / 0.09); }
    .status-dot.success { background: var(--success); box-shadow: 0 0 0 4px rgb(110 231 183 / 0.09); }
    .status-dot.warning { background: var(--warning); box-shadow: 0 0 0 4px rgb(251 191 36 / 0.1); }
    .status-label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }

    .switch { position: relative; width: 42px; min-height: 36px; flex: none; border: 0; border-radius: 0; background: transparent; }
    .switch::before { position: absolute; top: 8px; left: 3px; width: 36px; height: 20px; border-radius: 999px; background: rgb(245 245 244 / 0.22); content: ""; }
    .switch::after { position: absolute; top: 10px; left: 5px; width: 16px; height: 16px; border-radius: 50%; background: white; content: ""; box-shadow: 0 1px 3px rgb(0 0 0 / 0.35); }
    .switch.on::before { background: var(--accent); }
    .switch.on::after { left: 21px; }
    .switch.blocked { opacity: 0.42; }
    .button { display: inline-flex; min-width: 36px; min-height: 40px; cursor: default; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 8px; background: transparent; padding: 8px 14px; color: var(--muted); line-height: 1.15; }
    .button.primary { border-color: transparent; background: var(--accent); color: #0a0a0a; font-weight: 650; }
    .button.danger { color: var(--danger); }
    .button.danger-solid { border-color: #ef4444; background: #ef4444; color: white; font-weight: 650; }
    .button[disabled] { cursor: not-allowed; opacity: 0.42; }
    .button:focus, .close:focus, .tab:focus, .text-action:focus, .device-action:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    .switch:focus { outline: none; box-shadow: inset 0 -2px 0 var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 15px 0 0; }
    .fact { min-width: 0; }
    .fact span { display: block; margin-bottom: 4px; color: var(--quiet); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
    .fact strong { display: block; overflow-wrap: anywhere; color: var(--fg); font-size: 13px; font-weight: 550; }
    .quota { height: 3px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: rgb(245 245 244 / 0.1); }
    .quota > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

    .inventory { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 14px; }
    .inventory h2 { margin-bottom: 10px; }
    .plain-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
    .plain-list li { position: relative; padding-left: 17px; line-height: 1.45; }
    .plain-list li::before { position: absolute; top: 0; left: 0; color: var(--accent); content: "•"; }
    .plain-list.local li::before { color: var(--quiet); content: "—"; }

    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    .devices, .backups { border-top: 1px solid var(--hairline); }
    .device, .backup { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--hairline); padding: 8px 0; }
    .device-main, .backup-main { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .device-glyph, .backup-glyph { display: grid; width: 30px; height: 30px; flex: none; place-items: center; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
    .backup-glyph { border-color: rgb(251 191 36 / 0.28); background: rgb(251 191 36 / 0.07); color: var(--warning); }
    .device-name, .backup-name { display: block; overflow: hidden; font-size: 13px; font-weight: 560; text-overflow: ellipsis; white-space: nowrap; }
    .device-meta, .backup-meta { display: block; margin-top: 2px; color: var(--quiet); font-size: 11px; }
    .device-actions, .backup-actions { display: flex; flex: none; gap: 2px; }
    .device-action, .text-action { min-height: 36px; border: 0; background: transparent; padding: 6px 8px; color: var(--accent); font-size: 12px; }
    .text-action { color: var(--muted); }
    .text-action.danger { color: var(--danger); }
    .current { color: var(--accent); }

    .callout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; margin: 13px 0 2px; border: 1px solid rgb(251 191 36 / 0.28); border-radius: 10px; background: rgb(251 191 36 / 0.055); padding: 12px; }
    .callout.neutral { border-color: rgb(125 211 252 / 0.24); background: rgb(125 211 252 / 0.05); }
    .callout-icon { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 8px; background: rgb(251 191 36 / 0.12); color: var(--warning); font-weight: 800; }
    .callout.neutral .callout-icon { background: rgb(125 211 252 / 0.1); color: var(--accent); }
    .callout h2 { margin: 0 0 3px; }
    .callout p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .steps { display: grid; gap: 10px; margin: 17px 0 0; padding: 0; list-style: none; }
    .step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
    .step-number { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--border); border-radius: 50%; color: var(--muted); font-size: 11px; font-weight: 650; }
    .step.active .step-number { border-color: rgb(125 211 252 / 0.5); background: rgb(125 211 252 / 0.1); color: var(--accent); }
    .step p { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .field-label { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
    .field-label input { width: 100%; min-height: 42px; margin-top: 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--control); padding: 8px 11px; color: var(--fg); }

    .account-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
    .action-block { border-top: 1px solid var(--hairline); padding-top: 12px; }
    .action-block p { min-height: 36px; margin: 5px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .success-note { display: flex; align-items: center; gap: 9px; margin: 10px 0 2px; color: var(--muted); font-size: 12px; }
    .success-note strong { color: var(--success); font-weight: 650; }

    .modal-shade { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; border-radius: inherit; background: rgb(0 0 0 / 0.66); padding: 24px; }
    .dialog { width: min(500px, 100%); border: 1px solid var(--border); border-radius: 16px; background: var(--panel-solid); box-shadow: 0 24px 80px rgb(0 0 0 / 0.58); padding: 22px; }
    .dialog h1 { margin-bottom: 8px; font-size: 24px; }
    .dialog .lede { font-size: 13px; }
    .dialog-tag { display: inline-flex; min-height: 25px; align-items: center; margin-bottom: 13px; border-radius: 999px; background: rgb(125 211 252 / 0.09); padding: 4px 9px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .dialog-tag.danger { background: rgb(248 113 113 / 0.1); color: var(--danger); }
    .impact { display: grid; gap: 7px; margin: 15px 0; padding: 0; list-style: none; color: var(--muted); font-size: 12px; }
    .impact li { position: relative; padding-left: 18px; line-height: 1.4; }
    .impact li::before { position: absolute; left: 1px; color: var(--danger); content: "×"; font-weight: 700; }
    .impact.safe li::before { color: var(--success); content: "✓"; }
    .verified { display: flex; align-items: center; gap: 8px; margin: 14px 0; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: 10px 0; color: var(--muted); font-size: 12px; }
    .verified b { color: var(--success); font-weight: 650; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

    @media (max-width: 899px) {
      .canvas { display: none; }
      .drawer { inset: 0; width: 100%; border: 0; border-radius: 0; box-shadow: none; }
      .drawer-header { min-height: 72px; padding: 15px 14px 10px; }
      .settings-grid { display: block; padding: 0 14px 20px; }
      .tabs { position: static; display: flex; flex-direction: row; gap: 0; margin-bottom: 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--hairline); padding: 0; scrollbar-width: none; }
      .tabs::-webkit-scrollbar { display: none; }
      .tab { min-height: 40px; flex: none; border-left: 0; border-bottom: 2px solid transparent; padding: 7px 10px; white-space: nowrap; }
      .tab.active { border-left-color: transparent; border-bottom-color: var(--accent); }
      .account-page { max-width: none; }
      .section { padding: 14px 0; }
      .section.trust { padding-left: 15px; }
      .section.trust::before { top: 15px; bottom: 15px; }
      h1 { font-size: 25px; }
      .identity-row { align-items: flex-start; }
      .facts { grid-template-columns: 1fr; gap: 10px; }
      .inventory, .account-actions { grid-template-columns: 1fr; gap: 17px; }
      .device { min-height: 50px; }
      .modal-shade { position: fixed; border-radius: 0; padding: 14px; }
      .dialog { max-height: calc(100vh - 28px); overflow-y: auto; padding: 19px; }
    }

    @media (max-width: 430px) {
      .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow: visible; }
      .tab { min-width: 0; padding-inline: 4px; text-align: center; white-space: normal; }
      .brand-name { font-size: 15px; }
      .badge { max-width: 124px; text-align: center; }
      .status-head { gap: 10px; }
      .device, .backup { align-items: flex-start; }
      .device-actions, .backup-actions { flex-direction: column; }
      .device-action { min-width: 58px; }
    }
  </style>
</head>
<body>
  <div class="canvas" aria-hidden="true">
    <div class="canvas-time">5:42</div>
    <div class="canvas-focus">What deserves your attention?</div>
  </div>

  <main class="drawer" data-scroll-owner="settings" aria-label="Settings">
    <header class="drawer-header">
      <div class="brand">
        <svg class="mark" viewBox="0 0 128 128" role="img" aria-label="Tab Two">
          <defs><linearGradient id="signal" x1="22" y1="42" x2="94" y2="106" gradientUnits="userSpaceOnUse"><stop stop-color="#268CFF"/><stop offset="1" stop-color="#12C7E8"/></linearGradient></defs>
          <rect width="128" height="128" rx="28" fill="#07131F"/>
          <path d="M44 22h24l8 9h24a9 9 0 0 1 9 9v47a9 9 0 0 1-9 9H44a9 9 0 0 1-9-9V31a9 9 0 0 1 9-9Z" fill="#0C2235" stroke="#65D9F2" stroke-width="5"/>
          <path d="M25 38h27l8 9h25a9 9 0 0 1 9 9v45a9 9 0 0 1-9 9H25a9 9 0 0 1-9-9V47a9 9 0 0 1 9-9Z" fill="url(#signal)"/>
          <path d="M34 58h42M55 58v34" fill="none" stroke="#F7FBFF" stroke-width="9" stroke-linecap="round"/>
        </svg>
        <div><p class="brand-name">Tab Two</p><p class="brand-subtitle">Settings</p></div>
      </div>
      <button class="close" type="button" aria-label="Close settings">×</button>
    </header>

    <div class="settings-grid">
      <nav class="tabs" aria-label="Settings sections">
        <button class="tab" type="button">General</button>
        <button class="tab" type="button">Progress</button>
        <button class="tab" type="button">Widgets</button>
        <button class="tab" type="button">Connectors</button>
        <button class="tab" type="button">Data</button>
        <button class="tab active" type="button" aria-current="page">Account &amp; Sync</button>
      </nav>
      <div id="state-root" class="account-page"></div>
    </div>
  </main>

  <script>
    const state = new URLSearchParams(location.search).get('state') || 'sync-off'

    const accountHeader = (badge = 'Premium · Active') => `
      <section class="section">
        <p class="eyebrow">Account &amp; Sync</p>
        <div class="identity-row">
          <div class="identity">
            <div class="avatar" aria-hidden="true">A</div>
            <div class="identity-copy"><h1>Alex Morgan</h1><p>alex@example.com</p></div>
          </div>
          <span class="badge">${badge}</span>
        </div>
      </section>`

    const facts = (status, last, used, percent) => `
      <div class="facts" aria-label="Sync details">
        <div class="fact"><span>Status</span><strong>${status}</strong></div>
        <div class="fact"><span>Last successful sync</span><strong>${last}</strong></div>
        <div class="fact"><span>Encrypted storage</span><strong>${used} of 2 MB</strong><div class="quota" aria-hidden="true"><i style="width:${percent}"></i></div></div>
      </div>`

    const accountFooter = `
      <section class="section">
        <p class="eyebrow">Account</p>
        <div class="actions">
          <button class="button" type="button">Manage billing</button>
          <button class="button" type="button">Sign out</button>
          <button class="button danger" type="button">Data &amp; account</button>
        </div>
      </section>`

    const syncOff = `
      ${accountHeader('Complimentary subscription')}
      <section class="section trust">
        <div class="status-head">
          <div class="status-copy">
            <div class="status-line"><span class="status-dot"></span><span class="status-label">Sync off</span></div>
            <h1>Your data is local</h1>
            <p class="lede">Nothing from this installation has been uploaded. Turn on encrypted sync only when you want data to follow you.</p>
          </div>
          <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Enable encrypted sync" data-autofocus></button>
        </div>
        <div class="inventory">
          <div><h2>Encrypted when sync is on</h2><ul class="plain-list"><li>Settings and layouts</li><li>Tasks, notes, habits, goals, and links</li><li>Approved non-secret connector preferences</li></ul></div>
          <div><h2>Always stays on this device</h2><ul class="plain-list local"><li>Passwords, tokens, sessions, and feed or calendar URLs</li><li>Provider caches and responses</li><li>Uploaded images and device-local operational state</li></ul></div>
        </div>
      </section>
      <section class="section"><p class="helper">Signing in never turns on sync. Local backup, restore, and every existing connector remain available.</p></section>
      ${accountFooter}`

    const firstSync = `
      ${accountHeader()}
      <section class="section trust">
        <div class="status-line"><span class="status-dot"></span><span class="status-label">Ready to begin</span></div>
        <h1>Set up encrypted sync</h1>
        <p class="lede">Name this installation so you can recognize and remove it later.</p>
      </section>
      <div class="modal-shade">
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="first-sync-title">
          <span class="dialog-tag">Encrypted sync</span>
          <h1 id="first-sync-title">Name this device</h1>
          <p class="lede">Use a name you will recognize in your device list.</p>
          <label class="field-label">Device name<input type="text" value="Studio PC" maxlength="48" aria-label="Device name" data-autofocus /></label>
          <ol class="steps">
            <li class="step active"><span class="step-number">1</span><div><h3>Name and register this device</h3><p>Up to five installations can sync at once.</p></div></li>
            <li class="step"><span class="step-number">2</span><div><h3>Download before uploading</h3><p>Tab Two checks for existing encrypted data before it sends local changes.</p></div></li>
          </ol>
          <p class="helper">Passwords, tokens, sessions, feed URLs, caches, and uploaded images stay local.</p>
          <div class="dialog-actions"><button class="button" type="button">Cancel</button><button class="button primary" type="button">Enable &amp; download</button></div>
        </section>
      </div>`

    const upToDate = `
      ${accountHeader()}
      <section class="section trust">
        <div class="status-head">
          <div class="status-copy"><div class="status-line"><span class="status-dot success"></span><span class="status-label">Up to date</span></div><h1>Encrypted sync is on</h1><p class="lede">Eligible changes are current across your active devices.</p></div>
          <button class="switch on" type="button" role="switch" aria-checked="true" aria-label="Disable encrypted sync"></button>
        </div>
        ${facts('Up to date', 'Just now', '412 KB', '20%')}
      </section>
      <section class="section">
        <div class="section-heading"><h2>Devices</h2><span class="micro">2 of 5 active</span></div>
        <div class="devices">
          <div class="device"><div class="device-main"><span class="device-glyph">▣</span><span><span class="device-name">Studio PC</span><span class="device-meta">Current installation · Synced just now</span></span></div><div class="device-actions"><button class="device-action" type="button" data-autofocus>Rename</button></div></div>
          <div class="device"><div class="device-main"><span class="device-glyph">◇</span><span><span class="device-name">Travel Chromebook</span><span class="device-meta">Synced yesterday</span></span></div><div class="device-actions"><button class="device-action" type="button">Rename</button><button class="device-action" type="button">Remove</button></div></div>
        </div>
        <p class="helper">Removing a device stops future sync. It never erases local data on that installation.</p>
      </section>
      <section class="section"><div class="section-heading"><h2>Recovery copies</h2><span class="micro">None</span></div><p class="helper">If two devices change the same item, Tab Two keeps the displaced local version here before applying the synced version.</p></section>
      ${accountFooter}`

    const offline = `
      ${accountHeader()}
      <section class="section trust warning">
        <div class="status-head">
          <div class="status-copy"><div class="status-line"><span class="status-dot warning"></span><span class="status-label">Offline</span></div><h1>Tab Two keeps working</h1><p class="lede">Your local data is available. Three changes will sync when this device is back online.</p></div>
          <button class="switch on" type="button" role="switch" aria-checked="true" aria-label="Disable encrypted sync" data-autofocus></button>
        </div>
        ${facts('Offline · 3 waiting', 'Today at 5:34 PM', '412 KB', '20%')}
        <div class="callout neutral"><span class="callout-icon">↻</span><div><h2>No action needed</h2><p>Keep using Tab Two normally. Local edits are safe and no remote data will replace them while offline.</p></div></div>
      </section>
      <section class="section">
        <div class="section-heading"><h2>This device</h2><span class="micro">1 of 5 active</span></div>
        <div class="devices"><div class="device"><div class="device-main"><span class="device-glyph">▣</span><span><span class="device-name">Travel laptop</span><span class="device-meta">Current installation · Waiting for connection</span></span></div><span class="micro current">Current</span></div></div>
      </section>
      <section class="section"><p class="helper">Sync reconnects automatically while this Tab Two page is visible. Turning sync off stops all sync requests.</p></section>`

    const conflict = `
      ${accountHeader()}
      <section class="section trust warning">
        <div class="status-head">
          <div class="status-copy"><div class="status-line"><span class="status-dot warning"></span><span class="status-label">Needs attention</span></div><h1>Your local version is safe</h1><p class="lede">A note changed on two devices. We saved your local version before applying the newer synced copy.</p></div>
          <button class="switch on" type="button" role="switch" aria-checked="true" aria-label="Disable encrypted sync"></button>
        </div>
        ${facts('Needs attention', 'Today at 5:41 PM', '414 KB', '20%')}
      </section>
      <section class="section">
        <div class="section-heading"><h2>Recovery copies</h2><span class="micro">1 saved · Kept for 30 days</span></div>
        <div class="backups">
          <div class="backup"><div class="backup-main"><span class="backup-glyph">↺</span><span><span class="backup-name">Note · Weekly priorities</span><span class="backup-meta">Saved from Studio PC · Today at 5:41 PM</span></span></div><div class="backup-actions"><button class="device-action" type="button" data-autofocus>Review backup</button><button class="device-action" type="button">Delete</button></div></div>
        </div>
        <div class="callout neutral"><span class="callout-icon">i</span><div><h2>Choose when you are ready</h2><p>Review, export, restore, or delete this copy. Restoring creates a new synced change; it never overwrites silently.</p></div></div>
      </section>
      <section class="section"><div class="actions"><button class="button" type="button">Continue syncing</button></div><p class="helper">Other items remain up to date. Only this saved copy needs your review.</p></section>
      ${accountFooter}`

    const deviceLimit = `
      ${accountHeader()}
      <section class="section trust warning">
        <div class="status-head"><div class="status-copy"><div class="status-line"><span class="status-dot warning"></span><span class="status-label">Device limit</span></div><h1>Choose one device to remove</h1><p class="lede">Five installations are already syncing. Tab Two never removes one automatically.</p></div><button class="switch blocked" type="button" role="switch" aria-checked="false" aria-disabled="true" aria-label="Enable sync unavailable"></button></div>
      </section>
      <section class="section"><div class="section-heading"><h2>Active devices</h2><span class="micro">5 of 5 active</span></div><div class="devices"><div class="device"><div class="device-main"><span class="device-glyph">▣</span><span><span class="device-name">Studio PC</span><span class="device-meta">Synced 8 minutes ago</span></span></div><button class="device-action" type="button">Remove</button></div><div class="device"><div class="device-main"><span class="device-glyph">◇</span><span><span class="device-name">Travel Chromebook</span><span class="device-meta">Synced yesterday</span></span></div><button class="device-action" type="button">Remove</button></div><div class="device"><div class="device-main"><span class="device-glyph">▣</span><span><span class="device-name">Office profile</span><span class="device-meta">Synced 3 days ago</span></span></div><button class="device-action" type="button">Remove</button></div><div class="device"><div class="device-main"><span class="device-glyph">◇</span><span><span class="device-name">Kitchen display</span><span class="device-meta">Synced 2 weeks ago</span></span></div><button class="device-action" type="button">Remove</button></div><div class="device"><div class="device-main"><span class="device-glyph">▣</span><span><span class="device-name">Old browser profile</span><span class="device-meta">Synced 1 month ago</span></span></div><button class="device-action" type="button">Remove</button></div></div></section>
      <div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="remove-device-title"><span class="dialog-tag">Free one sync slot</span><h1 id="remove-device-title">Remove Old browser profile?</h1><p class="lede">This exact installation will stop receiving or sending synced updates.</p><ul class="impact safe"><li>Its existing local Tab Two data stays on that device.</li><li>Your other four devices keep syncing.</li></ul><p class="helper">Fresh Google verification is required before removal.</p><div class="dialog-actions"><button class="button" type="button">Cancel</button><button class="button primary" type="button" data-autofocus>Verify with Google</button></div></section></div>`

    const deletion = `
      ${accountHeader()}
      <section class="section trust">
        <div class="status-line"><span class="status-dot success"></span><span class="status-label">Synced data deleted</span></div><h1>Your local data remains</h1><p class="lede">The encrypted cloud copy and device records were deleted. Sync is off on this installation.</p>
        <div class="success-note"><span class="status-dot success"></span><strong>Completed</strong><span>just now</span></div>
      </section>
      <section class="section"><p class="eyebrow">Data &amp; account</p><div class="account-actions"><div class="action-block"><h2>Delete synced data</h2><p>Deletes the encrypted cloud copy and deactivates synced devices. Keeps your account, subscription, and all local data.</p><button class="button danger" type="button">Delete synced data</button></div><div class="action-block"><h2>Delete Tab Two account</h2><p>Ends premium access and billing, then deletes synced data, devices, identity, and account data. Keeps local data.</p><button class="button danger" type="button">Delete account</button></div></div></section>
      <div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="delete-account-title"><span class="dialog-tag danger">Permanent account action</span><h1 id="delete-account-title">Delete your Tab Two account?</h1><p class="lede">This is immediate and cannot be undone through support.</p><ul class="impact"><li>Ends premium access and stops future billing.</li><li>Deletes synced data, devices, identity, and Tab Two account data.</li></ul><ul class="impact safe"><li>Local data on every installation remains.</li></ul><div class="verified"><span class="status-dot success"></span><b>Google account verified</b><span>just now</span></div><label class="field-label">Type DELETE to confirm<input type="text" value="DELETE" aria-label="Type DELETE to confirm" /></label><div class="dialog-actions"><button class="button" type="button">Cancel</button><button class="button danger-solid" type="button" data-autofocus>Delete account</button></div></section></div>`

    const states = { 'sync-off': syncOff, 'first-sync': firstSync, 'up-to-date': upToDate, offline, conflict, 'device-limit': deviceLimit, deletion }
    document.documentElement.dataset.state = state
    document.getElementById('state-root').innerHTML = states[state] || syncOff
  </script>
</body>
</html>
